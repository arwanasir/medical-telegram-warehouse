name: 'medical_warehouse'
version: '1.0.0'
config-version: 2

# This tells dbt which profile to use from your profiles.yml
profile: 'medical_warehouse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  medical_warehouse:
    # Config indicated by + applies to all files under models/example/
    example:
      +materialized: view